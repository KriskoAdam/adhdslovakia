name: Prepare English article translations

on:
  push:
    branches:
      - main
    paths:
      - "content/clanky/sk/*.md"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: article-translations
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate missing English translations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          node scripts/translate-articles.mjs

      - name: Open translation review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/english-article-translations
          delete-branch: true
          commit-message: "Add English translations for new articles"
          title: "Review generated English article translations"
          body: |
            Gemini prepared English drafts for new Slovak articles.

            Please review the translation, especially medical statements, links, sources, and wording, before merging. Merging publishes the English articles.

