name: Prepare English article translations

on:
  push:
    branches:
      - setup/automatic-article-translations
    paths:
      - "content/clanky/sk/*.md"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: article-translations
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare isolated test event
        if: github.ref != 'refs/heads/main'
        run: |
          printf '{"commits":[{"added":["content/clanky/sk/translation-smoke-test.md"]}]}' > "$RUNNER_TEMP/translation-event.json"

      - name: Generate missing English translations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GITHUB_EVENT_PATH: ${{ github.ref == 'refs/heads/main' && github.event_path || format('{0}/translation-event.json', runner.temp) }}
        run: node scripts/translate-articles.mjs

      - name: Open translation review pull request
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/english-article-translations
          delete-branch: true
          commit-message: "Add English translations for new articles"
          title: "Review generated English article translations"
          body: |
            Gemini prepared English drafts for new Slovak articles.

            Please review the translation, especially medical statements, links, sources, and wording, before merging. Merging publishes the English articles.

      - name: Display isolated translation smoke test
        if: github.ref != 'refs/heads/main'
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from "node:fs/promises";
          import path from "node:path";

          const directory = "content/clanky/en";
          const files = await readdir(directory);
          const result = [];
          for (const file of files) {
            const content = await readFile(path.join(directory, file), "utf8");
            if (content.includes('translationKey: "translation-smoke-test-2026"')) {
              result.push({ file, content });
            }
          }
          if (result.length !== 1) {
            throw new Error(`Expected one isolated translation, found ${result.length}.`);
          }
          console.log(`Generated ${result[0].file}:\n${result[0].content}`);
          NODE

